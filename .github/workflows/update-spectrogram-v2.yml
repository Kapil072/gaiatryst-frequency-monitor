name: Update Spectrogram Data v2

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write  # Lets the bot push data.json back to the repo

concurrency:
  group: update-spectrogram
  cancel-in-progress: false

jobs:
  scrape-data:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packages and Playwright browser
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          python -m playwright install --with-deps chromium

      # Downloads the latest spectrograms and writes data.json to the repo root.
      # Exits non-zero if no spectrograms are found, so a source change fails the run.
      - name: Run the Spectrogram Scraper & Analyzer
        run: python api/test_scraping.py

      - name: Commit and push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to data.json"
            exit 0
          fi

          # [skip ci] prevents this commit from triggering another workflow run
          git commit -m "Auto-update Schumann resonance data [skip ci]"
          git pull --rebase origin main
          git push
